# Render Blueprint: one free web service running the RichDown game server.
services:
  - type: web
    name: PoorDown
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Signs the copies of each room that players' browsers keep, so games can be brought back after an
      # update. Render makes this random value once and keeps it across deploys.
      - key: SNAPSHOT_SECRET
        generateValue: true
